<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">

    <defs>

        <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">

            <stop offset="0%" stop-color="#72FF63"/>

            <stop offset="100%" stop-color="#00D9FF"/>

        </linearGradient>

    </defs>

    <circle
        cx="400"
        cy="400"
        r="300"
        fill="none"
        stroke="url(#green)"
        stroke-width="1.5"
        opacity=".25"
    />

    <circle
        cx="400"
        cy="400"
        r="250"
        fill="none"
        stroke="url(#green)"
        stroke-width="1"
        opacity=".35"
        stroke-dasharray="14 8"
    />

    <circle
        cx="400"
        cy="400"
        r="180"
        fill="none"
        stroke="url(#green)"
        stroke-width="1"
        opacity=".4"
    />

    <!-- Crosshair -->
    <line x1="400" y1="90" x2="400" y2="710"
          stroke="#72FF63"
          opacity=".15"/>

    <line x1="90" y1="400" x2="710" y2="400"
          stroke="#72FF63"
          opacity=".15"/>

</svg>